[project]
name = "fcast-hack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "epymorph>=1.2.0",
    "geopandas>=1.1.4",
    "pyogrio>=0.13.0",
    "rasterio>=1.4.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcast"]
